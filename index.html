<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="menuButton" aria-label="Open categories" aria-expanded="false">☰</button>
    <h1>My Library</h1>
    <button class="icon-button" id="topAddButton" aria-label="Add content">＋</button>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Categories">
    <div class="sidebar-heading">
      <strong>Categories</strong>
      <button class="icon-button" id="closeSidebar" aria-label="Close categories">×</button>
    </div>
    <nav id="categoryNav"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main>
    <section class="toolbar">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search content">
      </label>
      <select id="sortSelect" aria-label="Sort content">
        <option value="number">Number</option>
        <option value="newest">Newest</option>
        <option value="name">Name</option>
      </select>
    </section>

    <section class="content-heading">
      <div>
        <p id="sectionLabel">All content</p>
        <h2 id="itemCount">0 items</h2>
      </div>
    </section>

    <section class="grid" id="contentGrid"></section>
  </main>

  <button class="fab" id="fab" aria-label="Add content">＋</button>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="dialog-heading">
        <h2 id="dialogTitle">Add content</h2>
        <button type="button" class="icon-button" id="closeDialog" aria-label="Close">×</button>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="file">Upload file</button>
        <button type="button" class="tab" data-tab="text">Write text</button>
        <button type="button" class="tab" data-tab="youtube">YouTube</button>
      </div>

      <div class="tab-panel active" id="filePanel">
        <label class="file-drop" for="fileInput">
          <span class="upload-icon">↑</span>
          <strong>Choose a file</strong>
          <small>PDF, images, text, audio, video or documents</small>
          <input id="fileInput" type="file" multiple>
        </label>
      </div>

      <div class="tab-panel" id="textPanel">
        <label>Title
          <input id="textTitle" type="text" maxlength="120" placeholder="Content title">
        </label>
        <label>Text
          <textarea id="textBody" rows="7" placeholder="Write or paste content here"></textarea>
        </label>
      </div>

      <div class="tab-panel" id="youtubePanel">
        <label>Video title
          <input id="youtubeTitle" type="text" maxlength="120" placeholder="Video title">
        </label>
        <label>YouTube link
          <input id="youtubeUrl" type="url" placeholder="https://youtube.com/watch?v=...">
        </label>
      </div>

      <label id="editNameLabel">Name
        <input id="itemName" type="text" maxlength="120" placeholder="Item name">
      </label>

      <label>Category
        <select id="categorySelect"></select>
      </label>
      <label id="categoryNameLabel">Category name
        <input id="categoryName" type="text" maxlength="40" placeholder="Type a category name">
      </label>
      <label id="newCategoryLabel">New category
        <input id="newCategory" type="text" maxlength="40" placeholder="Optional">
      </label>
      <label id="numberLabel">Number
        <input id="itemNumber" type="number" min="1" step="1" placeholder="Optional">
      </label>

      <button class="primary-button" id="saveButton" type="submit">Save</button>
    </form>
  </dialog>

  <dialog id="viewerDialog">
    <div class="viewer-heading">
      <h2 id="viewerTitle"></h2>
      <button type="button" class="icon-button" id="closeViewer" aria-label="Close">×</button>
    </div>
    <div id="viewerContent"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
