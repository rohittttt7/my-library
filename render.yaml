services:
  - type: web
    name: my-library
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LIBRARY_ACCESS_PASSWORD
        sync: false
