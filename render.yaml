services:
  - type: web
    name: my-library
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
    disk:
      name: library-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
